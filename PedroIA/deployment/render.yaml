# Render.com blueprint — backend + managed Postgres (free tier friendly).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pedroia-backend
    runtime: docker
    dockerfilePath: docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: pedroia-db
          property: connectionString
      # Add your model keys as secrets in the Render dashboard:
      # ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY / DEEPSEEK_API_KEY

databases:
  - name: pedroia-db
    plan: free
    databaseName: pedroia
    user: pedroia
