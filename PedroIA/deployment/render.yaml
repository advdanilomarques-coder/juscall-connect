# Render.com blueprint — backend + managed Postgres (free tier friendly).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pedroia-backend
    runtime: docker
    # The repo root is `juscall-connect`; the project lives in the PedroIA/ subfolder.
    rootDir: PedroIA
    dockerfilePath: docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Protects the hosted backend. Set a strong value in the dashboard (or let Render generate one).
      - key: API_KEYS
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pedroia-db
          property: connectionString
      # Add your model keys as secrets in the Render dashboard (at least one):
      # ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY / DEEPSEEK_API_KEY

databases:
  - name: pedroia-db
    plan: free
    databaseName: pedroia
    user: pedroia
