<title>Ju · Atendimento JusCall</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Assistente virtual do escritório JusCall: vistos para Portugal, juros abusivos e busca e apreensão de veículos.">
<style>
  :root {
    --ground: #eef1f6;
    --panel: #ffffff;
    --panel-2: #f4f6fa;
    --ink: #17202e;
    --ink-soft: #55617a;
    --line: #dde3ec;
    --primary: #1f3a5f;
    --primary-ink: #ffffff;
    --accent: #b8892f;
    --bot-bubble: #f1f4f9;
    --bot-ink: #1c2636;
    --user-bubble: #1f3a5f;
    --user-ink: #ffffff;
    --wa: #1fa855;
    --wa-ink: #ffffff;
    --shadow: 0 18px 50px -24px rgba(20,34,58,.45);
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0c1017;
      --panel: #121826;
      --panel-2: #0f151f;
      --ink: #e7ecf5;
      --ink-soft: #94a1b8;
      --line: #232d3d;
      --primary: #6f9bd1;
      --primary-ink: #0c1017;
      --accent: #d4a548;
      --bot-bubble: #1a2334;
      --bot-ink: #dfe6f1;
      --user-bubble: #38598a;
      --user-ink: #f4f8ff;
      --wa: #23b862;
      --wa-ink: #05120a;
      --shadow: 0 18px 50px -20px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0c1017;
    --panel: #121826;
    --panel-2: #0f151f;
    --ink: #e7ecf5;
    --ink-soft: #94a1b8;
    --line: #232d3d;
    --primary: #6f9bd1;
    --primary-ink: #0c1017;
    --accent: #d4a548;
    --bot-bubble: #1a2334;
    --bot-ink: #dfe6f1;
    --user-bubble: #38598a;
    --user-ink: #f4f8ff;
    --wa: #23b862;
    --wa-ink: #05120a;
    --shadow: 0 18px 50px -20px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 460px;
    height: 100dvh;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  @media (min-width: 520px) {
    body { align-items: center; padding: 24px; }
    .app { height: min(860px, 94dvh); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; }
  }

  /* Header */
  header {
    background: var(--primary);
    color: var(--primary-ink);
    padding: 16px 18px calc(16px + env(safe-area-inset-top, 0px));
    padding-top: max(16px, env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 44px; height: 44px; flex: 0 0 auto;
    border-radius: 50%;
    background: color-mix(in srgb, var(--primary-ink) 16%, transparent);
    display: grid; place-items: center;
  }
  .avatar svg { width: 24px; height: 24px; }
  .id h1 {
    margin: 0;
    font-family: "Fraunces", Georgia, serif;
    font-size: 1.18rem;
    font-weight: 600;
    letter-spacing: .2px;
    line-height: 1.1;
  }
  .id p {
    margin: 2px 0 0;
    font-size: .74rem;
    opacity: .85;
    display: flex; align-items: center; gap: 6px;
    letter-spacing: .3px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #35d07f; box-shadow: 0 0 0 3px color-mix(in srgb,#35d07f 30%, transparent); }

  /* Chat area */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
    background:
      radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 42%),
      var(--panel-2);
  }
  .row { display: flex; }
  .row.bot { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%;
    padding: 11px 14px;
    font-size: .93rem;
    line-height: 1.5;
    border-radius: 18px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: pop .28s ease;
  }
  .bot .bubble { background: var(--bot-bubble); color: var(--bot-ink); border-bottom-left-radius: 6px; }
  .user .bubble { background: var(--user-bubble); color: var(--user-ink); border-bottom-right-radius: 6px; }
  .bubble strong { font-weight: 700; }
  .bubble a { color: inherit; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }

  .typing { display: inline-flex; gap: 4px; align-items: center; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); opacity: .5; animation: blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay: .2s; }
  .typing span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,60%,100%{ transform: translateY(0); opacity:.35 } 30%{ transform: translateY(-4px); opacity:.9 } }

  /* Quick replies + actions */
  .actions {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 4px 14px 12px;
  }
  .chip {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel);
    color: var(--primary);
    font: inherit; font-size: .87rem; font-weight: 600;
    padding: 9px 14px; border-radius: 999px; cursor: pointer;
    transition: transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .chip:hover { background: var(--panel-2); border-color: var(--primary); }
  .chip:active { transform: scale(.96); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip.wa {
    background: var(--wa); border-color: var(--wa); color: var(--wa-ink);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip.wa:hover { filter: brightness(1.05); background: var(--wa); }
  .chip.wa svg { width: 16px; height: 16px; }

  footer {
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
    background: var(--panel);
    text-align: center;
  }
  footer p { margin: 0; font-size: .68rem; color: var(--ink-soft); line-height: 1.4; }
  .restart {
    background: none; border: none; color: var(--primary); font: inherit;
    font-size: .78rem; font-weight: 600; cursor: pointer; margin-top: 6px; padding: 4px 8px; border-radius: 8px;
  }
  .restart:hover { background: var(--panel-2); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; }
  }
</style>

<div class="app">
  <header>
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v18M7 21h10M5 7l14-2"/><path d="M5 7l-2.5 6a3 3 0 0 0 5 0L5 7z"/><path d="M19 5l-2.5 6a3 3 0 0 0 5 0L19 5z"/>
      </svg>
    </div>
    <div class="id">
      <h1>Ju · Assistente JusCall</h1>
      <p><span class="dot"></span> Online agora · resposta imediata</p>
    </div>
  </header>

  <main class="chat" id="chat" aria-live="polite"></main>
  <div class="actions" id="actions"></div>

  <footer>
    <p>Orientações gerais e automáticas. Não substituem a consulta com um advogado.</p>
    <button class="restart" id="restart" type="button">↻ Recomeçar conversa</button>
  </footer>
</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">

<script>
(function () {
  var WHATSAPP = "5511991537423";
  var chat = document.getElementById("chat");
  var actions = document.getElementById("actions");

  function waLink(msg) {
    return "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg);
  }

  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function addBubble(who, html) {
    var row = document.createElement("div");
    row.className = "row " + who;
    var b = document.createElement("div");
    b.className = "bubble";
    b.innerHTML = html;
    row.appendChild(b);
    chat.appendChild(row);
    scrollDown();
    return b;
  }

  // Sequenced bot messages with a typing indicator
  function botSay(messages, done) {
    var queue = messages.slice();
    function next() {
      if (!queue.length) { if (done) done(); return; }
      var typingRow = document.createElement("div");
      typingRow.className = "row bot";
      typingRow.innerHTML = '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
      chat.appendChild(typingRow);
      scrollDown();
      var text = queue.shift();
      var delay = Math.min(1100, 350 + text.replace(/<[^>]+>/g, "").length * 12);
      setTimeout(function () {
        chat.removeChild(typingRow);
        addBubble("bot", text);
        next();
      }, delay);
    }
    next();
  }

  function clearActions() { actions.innerHTML = ""; }

  function addChip(label, onClick, isWa) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (isWa ? " wa" : "");
    if (isWa) {
      b.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.02h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.23 8.23 0 0 1-1.26-4.35c0-4.54 3.7-8.23 8.25-8.23 2.2 0 4.27.86 5.83 2.42a8.19 8.19 0 0 1 2.41 5.82c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.8-.79.97-.14.16-.29.18-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.14.17-.25.25-.41.08-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43l-.48-.01c-.16 0-.43.06-.65.31-.22.25-.85.83-.85 2.03 0 1.2.87 2.35.99 2.51.12.16 1.71 2.62 4.15 3.67.58.25 1.03.4 1.39.51.58.19 1.11.16 1.53.1.47-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.11-.22-.17-.47-.29Z"/></svg>';
      b.appendChild(document.createTextNode(label));
    } else {
      b.textContent = label;
    }
    b.addEventListener("click", onClick);
    actions.appendChild(b);
    return b;
  }

  function waChip(message) {
    var a = addChip("Falar com advogado no WhatsApp", function () {
      window.open(waLink(message), "_blank");
    }, true);
    return a;
  }

  function menuChip() {
    addChip("↩ Voltar ao início", function () { userPicked("Voltar ao início", start); });
  }

  function userPicked(label, handler) {
    clearActions();
    addBubble("user", label);
    setTimeout(handler, 250);
  }

  // ---------- Conversation flows ----------

  function start() {
    clearActions();
    botSay([
      "Olá! Eu sou a <strong>Ju</strong>, assistente virtual do escritório <strong>JusCall</strong>. 👋",
      "Posso te dar uma orientação inicial e já te conectar com um advogado. Sobre qual assunto você precisa de ajuda?"
    ], function () {
      addChip("🇵🇹 Visto para Portugal", function () { userPicked("Quero ajuda com visto para Portugal", vistoStart); });
      addChip("💰 Juros abusivos", function () { userPicked("Acho que estou pagando juros abusivos", jurosStart); });
      addChip("🚗 Financiamento / busca e apreensão", function () { userPicked("Problema com financiamento do meu veículo", carroStart); });
    });
  }

  // --- Visto Portugal ---
  function vistoStart() {
    botSay([
      "Ótimo! Ajudamos brasileiros a morar legalmente em Portugal. 🇵🇹",
      "Qual é o seu principal objetivo?"
    ], function () {
      addChip("Trabalhar", function () { userPicked("Quero trabalhar em Portugal", function(){ vistoResp("trabalho"); }); });
      addChip("Estudar", function () { userPicked("Quero estudar em Portugal", function(){ vistoResp("estudo"); }); });
      addChip("Aposentado / renda própria", function () { userPicked("Tenho renda própria / sou aposentado", function(){ vistoResp("renda"); }); });
      addChip("Reunir minha família", function () { userPicked("Quero levar / reunir minha família", function(){ vistoResp("familia"); }); });
    });
  }
  function vistoResp(tipo) {
    var m = {
      trabalho: "Para trabalhar, os caminhos mais comuns são o <strong>Visto de Procura de Trabalho</strong> e o visto para <strong>trabalho subordinado</strong> (com contrato). Cidadãos de países da CPLP, como o Brasil, têm um processo facilitado.",
      estudo: "Para estudar, existe o <strong>Visto de Estudante (D4)</strong>, que exige matrícula/aceitação em instituição portuguesa, comprovação de meios de subsistência e seguro de saúde.",
      renda: "Se você tem renda própria (aposentadoria, aluguéis, investimentos), o <strong>Visto D7</strong> é o mais indicado. É preciso comprovar renda regular e ter onde morar em Portugal.",
      familia: "No <strong>reagrupamento familiar</strong>, quem já tem residência legal em Portugal pode trazer cônjuge, filhos e, em certos casos, pais. A documentação do vínculo é essencial."
    };
    botSay([
      m[tipo],
      "Cada caso tem exigências específicas de documentos e prazos. O ideal é um advogado analisar o seu perfil e montar a estratégia certa para aprovar o seu visto.",
      "Quer falar agora com um dos nossos advogados? É gratuito e sem compromisso."
    ], function () {
      waChip("Olá! Vim pelo chatbot da JusCall. Preciso de ajuda com VISTO PARA PORTUGAL (" + tipo + "). Meu nome é: ");
      menuChip();
    });
  }

  // --- Juros abusivos ---
  function jurosStart() {
    botSay([
      "Entendo. Muitos contratos de banco e financeira cobram <strong>juros acima do permitido</strong>, tarifas indevidas e seguros embutidos. 💰",
      "Que tipo de contrato é esse?"
    ], function () {
      addChip("Financiamento de veículo", function () { userPicked("É um financiamento de veículo", function(){ jurosResp(); }); });
      addChip("Empréstimo / consignado", function () { userPicked("É um empréstimo ou consignado", function(){ jurosResp(); }); });
      addChip("Cartão de crédito / cheque especial", function () { userPicked("É cartão de crédito ou cheque especial", function(){ jurosResp(); }); });
      addChip("Financiamento imobiliário", function () { userPicked("É um financiamento imobiliário", function(){ jurosResp(); }); });
    });
  }
  function jurosResp() {
    botSay([
      "Nesses contratos é comum encontrar: <strong>juros acima da média do mercado</strong>, capitalização (juros sobre juros) indevida, tarifas de cadastro e seguros que você nem pediu.",
      "Com uma <strong>revisão do contrato</strong>, muitas vezes é possível <strong>reduzir a parcela</strong> e até <strong>recuperar valores pagos a mais</strong>.",
      "Para saber quanto você pode economizar, o advogado precisa analisar o contrato. Posso te encaminhar agora?"
    ], function () {
      waChip("Olá! Vim pelo chatbot da JusCall. Quero uma REVISÃO por JUROS ABUSIVOS no meu contrato. Meu nome é: ");
      menuChip();
    });
  }

  // --- Carro / busca e apreensão ---
  function carroStart() {
    botSay([
      "Vamos resolver isso com calma. 🚗 Me conta: em que situação você está?"
    ], function () {
      addChip("Estou atrasado nas parcelas", function () { userPicked("Estou atrasado nas parcelas", function(){ carroResp("atraso"); }); });
      addChip("Recebi ação de busca e apreensão", function () { userPicked("Recebi uma ação de busca e apreensão", function(){ carroResp("acao"); }); });
      addChip("Meu carro já foi apreendido", function () { userPicked("Meu carro já foi apreendido", function(){ carroResp("apreendido"); }); });
    });
  }
  function carroResp(fase) {
    var m = {
      atraso: "Ainda dá tempo de agir. É possível <strong>renegociar</strong> e evitar a ação. Se o contrato tiver juros abusivos, isso também pode ser usado a seu favor.",
      acao: "Fique tranquilo, você tem direitos. Após ser citado, é possível fazer a <strong>purgação da mora</strong> (pagar o que está em atraso) e ficar com o veículo, dentro do prazo legal. Agir rápido é fundamental.",
      apreendido: "Mesmo com o veículo apreendido ainda há caminhos: discutir o valor da dívida, apontar <strong>abusos no contrato</strong> e, em alguns casos, reaver o bem ou valores pagos. Precisamos ver os prazos com urgência."
    };
    botSay([
      m[fase],
      "⏱️ Nesses casos o <strong>prazo é curto</strong> e faz toda a diferença. O melhor é falar com um advogado o quanto antes.",
      "Quer que um advogado analise seu caso agora?"
    ], function () {
      waChip("Olá! Vim pelo chatbot da JusCall. Tenho um problema de FINANCIAMENTO/BUSCA E APREENSÃO do meu veículo (" + fase + "). Meu nome é: ");
      menuChip();
    });
  }

  document.getElementById("restart").addEventListener("click", function () {
    chat.innerHTML = "";
    clearActions();
    start();
  });

  start();
})();
</script>
