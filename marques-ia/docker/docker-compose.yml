services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Serviço opcional: roda a própria aplicação em container (alternativa ao
  # venv usado pelo install-all.sh). Use com:
  #   docker compose -f docker/docker-compose.yml --profile full up -d
  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ../backend/storage:/app/storage
    profiles:
      - full

volumes:
  pgdata:
